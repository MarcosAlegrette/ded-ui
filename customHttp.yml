# Headers de caché para Amplify Hosting.
customHeaders:
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  # JS y CSS de Vite llevan hash en el nombre
  - pattern: '/assets/*.js'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '/assets/*.css'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # Arte, sonidos y fuentes originales: 30 días
  - pattern: '/**/*.webp'
    headers:
      - key: Cache-Control
        value: 'public, max-age=2592000'
  - pattern: '/**/*.ogg'
    headers:
      - key: Cache-Control
        value: 'public, max-age=2592000'
  - pattern: '/**/*.mp3'
    headers:
      - key: Cache-Control
        value: 'public, max-age=2592000'
